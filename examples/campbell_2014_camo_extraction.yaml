nodes:
- id: camo:po4_fertilization
  name: Rock phosphate fertilization
  entity_type: management_intervention
  entity_term: rock phosphate fertilization (0-2-0 NPK; 30 g/m² low, 90 g/m² high)
  measured_attribute: phosphate addition rate
  state_or_change_qualifier: increased
  source_spans:
  - text: The phosphate fertilizer consisted of rock phosphate (0-2-0, NPK), with
      a dose of 30 g m-2 rock phosphate in the low dose treatment and 90 g m-2 in
      the high dose treatments.
- id: camo:straw_mulch
  name: Straw mulch application (microclimate amelioration)
  entity_type: management_intervention
  entity_term: straw mulch cover (Terrafix S31)
  measured_attribute: mulch cover (present/absent)
  state_or_change_qualifier: present
  source_spans:
  - text: The mulch consisted of straw attached to a plastic mesh (Terrafix® S31),
      cut into 2.5 m × 2.5 m squares and pegged into place over plots.
- id: camo:mulch_fert_alone
  name: Mulch and phosphorus fertilization alone (no Sphagnum fragment spreading)
  entity_type: management_intervention
  entity_term: microclimate amelioration + phosphorus fertilization without fragment
    introduction
  measured_attribute: combined treatment (fragments withheld)
  state_or_change_qualifier: occurred
  source_spans:
  - text: Could we simplify these protocols by just ameliorating environmental conditions
      and not spreading fragments?
- id: camo:fragment_spreading
  name: Spreading of Sphagnum fragments over bare peat
  entity_type: management_intervention
  entity_term: Sphagnum fragment spreading
  measured_attribute: fragment introduction (present/absent)
  state_or_change_qualifier: occurred
  source_spans:
  - text: The spreading of fragments on top of severely disturbed surface peats appears
      to be required in order to rehabilitate peatlands, even when extensive undisturbed
      peatlands are found nearby.
  applied_to:
  - entity_term: Q30019
- id: camo:large_fragment_spreading
  name: Spreading large Sphagnum fragments with capitula (+ light fertilization, no
    mulch)
  entity_type: management_intervention
  entity_term: spreading of large Sphagnum fragments with capitula
  measured_attribute: fragment size / capitula presence
  state_or_change_qualifier: occurred
  source_spans:
  - text: We have already demonstrated that other severely disturbed peat surfaces
      in the HBL can be successfully revegetated if Sphagnum fragments are spread,
      with light fertilization but no mulch (Corson and Campbell 2013).
  applied_to:
  - entity_term: Q30019
- id: camo:low_surface_phosphorus
  name: Low bioavailable phosphorus in surface peat
  entity_type: environmental_variable
  entity_term: phosphorus
  measured_attribute: bioavailable phosphorus concentration (< 0.03 mg/kg)
  state_or_change_qualifier: decreased
  source_spans:
  - text: Sphagnum requires phosphorus to germinate and establish, but phosphorus
      is in extremely low concentrations in peatlands (Sundberg and Rydin 2002).
  - text: Phosphorus content of these peats is quite low (bioavailable phosphorus
      < 0.03 mg/kg, n = 5; Campbell, unpubl. data)
- id: camo:phosphorus_competition
  name: Microbial decomposition and plant/bryophyte uptake competing for added phosphorus
  entity_type: environmental_process
  entity_term: competition for added phosphorus (microbial decomposition and plant
    uptake)
  measured_attribute: phosphorus sequestration / uptake
  state_or_change_qualifier: ongoing
  source_spans:
  - text: microbial decomposition of peat or uptake by other plants may also be competing
      for added nutrients (Silvola 1988, Pouliot et al. 2009)
  - text: colonizing bryophytes might absorb phosphorus, without exhibiting any growth
      effect.
- id: camo:surface_drying_crust
  name: Surface drying and crust formation on bare peat (steep surface moisture gradient)
  entity_type: environmental_process
  entity_term: surface peat drying and crust formation
  measured_attribute: surface moisture / crusting
  state_or_change_qualifier: present
  source_spans:
  - text: These cut hummocks also had some surface crusting within the top few millimeters,
      so a strong moisture gradient was likely present; moisture conditions at the
      peat surface may not have been conducive for spores or small vegetative fragments.
- id: camo:near_surface_ice
  name: Shallow near-surface ice and low peat temperature
  entity_type: environmental_variable
  entity_term: near-surface ground ice
  measured_attribute: active layer thickness / ice content (ice closer to surface)
  state_or_change_qualifier: present
  source_spans:
  - text: Ice is present closer to the surface over winter road clearances as compared
      to adjacent undisturbed peatland (43 cm under cut hummocks in August 2008 ...
      and 115 cm in undisturbed peatland ...). The ice content and low temperature
      in the peats may limit plant growth, at least for vascular plant species.
- id: camo:harsh_winter_exposure
  name: Repeated exposure to harsh winter conditions (bare, raised cut hummocks)
  entity_type: environmental_process
  entity_term: winter exposure of bare, raised cut hummocks
  measured_attribute: exposure to harsh winter conditions
  state_or_change_qualifier: ongoing
  source_spans:
  - text: because of the lack of vegetation on winter roads and the slightly raised
      microtopography of cut hummocks, they should be repeatedly exposed to harsh
      winter conditions (Arseneault and Payette 1992). This could be maintaining the
      ice in cut hummocks
- id: camo:small_propagule
  name: Spores or small vegetative propagules (vs large fragments with capitula)
  entity_type: environmental_variable
  entity_term: Sphagnum propagule type (spore or small fragment)
  measured_attribute: propagule size / type
  state_or_change_qualifier: present
  source_spans:
  - text: Sphagnum readily recolonizes in these subarctic peatlands from large fragments
      with capitula (Corson and Campbell 2013), however spores or small fragments
      generally have a lower ability to establish (Rochefort 2000, Rochefort et al.
      2003).
  applied_to:
  - entity_term: Q30019
- id: camo:time_succession
  name: Time since treatment (succession, 2008–2010)
  entity_type: environmental_variable
  entity_term: time since disturbance / treatment
  measured_attribute: elapsed time (sampling date)
  state_or_change_qualifier: increased
  source_spans:
  - text: Species assemblages did however change over time, with significant differences
      between May and August 2008 (p = 0.0001) and between August 2008 and August
      2010 (p = 0.0001, Table 3, Figure 2).
- id: camo:sphagnum_recolonization_incr
  name: Increased Sphagnum recolonization
  entity_type: taxon
  entity_term: Q30019
  measured_attribute: PATO:0000070
  state_or_change_qualifier: increased
  source_spans:
  - text: Rock phosphate fertilization and straw mulch did not increase the recolonization
      of Sphagnum nor of other bryophytes, lichens or vascular plants.
- id: camo:sphagnum_establishment
  name: Sphagnum germination and establishment
  entity_type: environmental_process
  entity_term: Sphagnum germination and establishment
  measured_attribute: germination / establishment success
  state_or_change_qualifier: occurred
  source_spans:
  - text: if Sphagnum propagules occur on cut hummocks, they do not establish because
      of unfavourable conditions in surface peats.
  applied_to:
  - entity_term: Q30019
- id: camo:vegetation_cover_incr
  name: Increased vegetation cover (overall and by plant group)
  entity_type: environmental_variable
  entity_term: plant assemblage (vascular, bryophyte, lichen)
  measured_attribute: percent cover
  state_or_change_qualifier: increased
  source_spans:
  - text: Straw mulch and fertilizer treatments had no effect on cover, taxon richness
      or Simpson's diversity, either overall or looking at lichens, bryophytes or
      vascular plants separately (Table 1).
- id: camo:taxon_richness_incr
  name: Increased taxon richness
  entity_type: environmental_variable
  entity_term: plant assemblage
  measured_attribute: taxon richness
  state_or_change_qualifier: increased
  source_spans:
  - text: Straw mulch and fertilizer treatments had no effect on cover, taxon richness
      or Simpson's diversity
- id: camo:simpsons_diversity_incr
  name: Increased Simpson's diversity (1−D)
  entity_type: environmental_variable
  entity_term: plant assemblage
  measured_attribute: Simpson's diversity index (1−D)
  state_or_change_qualifier: increased
  source_spans:
  - text: Straw mulch and fertilizer treatments had no effect on cover, taxon richness
      or Simpson's diversity
- id: camo:gravimetric_water_content
  name: Gravimetric water content of surface peat
  entity_type: environmental_variable
  entity_term: surface peat
  measured_attribute: gravimetric water content
  state_or_change_qualifier: unchanged
  source_spans:
  - text: Mulch cover did not affect gravimetric water content of surface peats on
      these cut hummocks in August 2008 during a dry spell (F1,25 = 0.2, p = 0.63);
      water content remained high (89.0 ± 0.5 %).
- id: camo:active_layer_thickness
  name: Active layer thickness
  entity_type: environmental_variable
  entity_term: peat active layer
  measured_attribute: active layer thickness
  state_or_change_qualifier: unchanged
  source_spans:
  - text: 'Neither did the mulch affect the thickness of the active layer in August
      2008 (F1,25 = 0.3, p = 0.57; mean ± SE: 43.1 ± 1.6 cm).'
- id: camo:species_assemblage
  name: Species assemblage composition on cut hummocks
  entity_type: environmental_variable
  entity_term: plant community (vascular, bryophyte, lichen)
  measured_attribute: community composition (Bray–Curtis / PERMANOVA)
  source_spans:
  - text: The effects of treatments on species assemblages over the three sampling
      dates were tested using ... permutational multivariate analysis of variance
      (PERMANOVA procedure)
- id: camo:assemblage_dispersion
  name: Among-plot assemblage dispersion (variability)
  entity_type: environmental_variable
  entity_term: plant community
  measured_attribute: multivariate dispersion (PERMDISP)
  state_or_change_qualifier: decreased
  source_spans:
  - text: Assemblages in different treatments were also more dispersed in May 2008
      ... and decreased by August 2008 and again by August 2010, meaning that species
      assemblages were becoming less variable with time.
- id: camo:alternative_stable_state
  name: Alternative (perhaps stable) state atypical of peatland
  entity_type: environmental_variable
  entity_term: sparse community atypical of peatland (bryophyte/lichen colonizers
    of disturbed peat)
  measured_attribute: community state
  state_or_change_qualifier: present
  source_spans:
  - text: The overall shift in species assemblages over time towards sparse communities
      atypical of peatlands and the decreasing dispersion of the assemblage suggests
      that species assemblages are reaching an alternative and perhaps stable state,
      away from typical peatland communities.
- id: camo:peatland_rehabilitation
  name: Rehabilitation of peatland (recovery to typical peatland community)
  entity_type: environmental_process
  entity_term: peatland rehabilitation / recolonization of severely disturbed bare
    peat
  measured_attribute: recovery toward typical peatland community
  state_or_change_qualifier: occurred
  source_spans:
  - text: techniques such as phosphorus fertilization and microclimate moderation
      alone are ineffective to rehabilitate subarctic peatlands with severe surface-disturbances
- id: camo:sphagnum_abundance_temporal
  name: Sphagnum abundance (temporal change)
  entity_type: taxon
  entity_term: Q30019
  measured_attribute: PATO:0000070
  source_spans:
  - text: Sphagnum abundance did change slightly but significantly over time (F2,50
      = 3.6, p = 0.035), with a drop from May to August 2008 of 11 to 5% of quadrats,
      and a rebound by August 2010 to 9% of quadrats.
- id: camo:plant_growth_vascular
  name: Plant growth (especially vascular plants)
  entity_type: environmental_process
  entity_term: plant growth
  measured_attribute: growth / establishment
  state_or_change_qualifier: decreased
  source_spans:
  - text: The ice content and low temperature in the peats may limit plant growth,
      at least for vascular plant species.
  applied_to:
  - entity_term: vascular plants
- id: camo:establishment_ability
  name: Propagule establishment ability
  entity_type: environmental_variable
  entity_term: Sphagnum propagule establishment
  measured_attribute: ability to establish
  state_or_change_qualifier: decreased
  source_spans:
  - text: spores or small fragments generally have a lower ability to establish (Rochefort
      2000, Rochefort et al. 2003).
  applied_to:
  - entity_term: Q30019
